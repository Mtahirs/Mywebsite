<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Writing — Muhammad Tahir</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=DM+Mono:wght@300;400&family=Instrument+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #F5F0E8; --ink: #1A1814; --olive: #4A4832;
      --muted: #8C8472; --rule: #D8D2C4; --accent: #6B6044;
      --paper: #EDE8DF;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --mono: 'DM Mono', monospace;
      --sans: 'Instrument Sans', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body { background: var(--cream); color: var(--ink); font-family: var(--serif); min-height: 100vh; cursor: none; overflow-x: hidden; }
    #cursor-dot, #cursor-ring { position: fixed; border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%,-50%); }
    #cursor-dot { width: 6px; height: 6px; background: var(--ink); }
    #cursor-ring { width: 28px; height: 28px; border: 1px solid var(--ink); opacity: 0.4; transition: left 0.08s, top 0.08s; }
    body::before { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E"); opacity: 0.35; pointer-events: none; z-index: 0; }
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 3rem; background: rgba(245,240,232,0.88); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); }
    .nav-logo { font-family: var(--serif); font-weight: 500; font-size: 1.1rem; letter-spacing: 0.04em; color: var(--ink); text-decoration: none; }
    .nav-links { display: flex; gap: 2.5rem; }
    .nav-links a { font-family: var(--sans); font-size: 0.78rem; font-weight: 400; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--ink); }
    .page { position: relative; z-index: 1; }
    .blog-header { padding: 9rem 3rem 4rem; border-bottom: 1px solid var(--rule); }
    .blog-header-inner { max-width: 1100px; margin: 0 auto; }
    .blog-eyebrow { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 1.5rem; }
    .blog-title { font-family: var(--serif); font-weight: 300; font-size: clamp(2.8rem,6vw,5rem); line-height: 1.05; letter-spacing: -0.01em; color: var(--ink); }
    .blog-title em { font-style: italic; font-weight: 300; }
    .blog-desc { margin-top: 1.5rem; font-family: var(--sans); font-size: 0.9rem; color: var(--muted); max-width: 480px; line-height: 1.7; }
    .filter-bar { padding: 1.5rem 3rem; border-bottom: 1px solid var(--rule); }
    .filter-bar-inner { max-width: 1100px; margin: 0 auto; display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
    .filter-label { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-right: 0.5rem; }
    .filter-btn { font-family: var(--sans); font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.4rem 1rem; border: 1px solid var(--rule); background: transparent; color: var(--muted); cursor: none; transition: all 0.2s; }
    .filter-btn:hover { border-color: var(--accent); color: var(--ink); }
    .filter-btn.active { background: var(--ink); color: var(--cream); border-color: var(--ink); }
    .content-area { max-width: 1100px; margin: 0 auto; padding: 3rem 3rem 6rem; }
    .featured-post { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--rule); margin-bottom: 4rem; cursor: none; transition: box-shadow 0.3s; }
    .featured-post:hover { box-shadow: 0 8px 40px rgba(26,24,20,0.08); }
    .featured-label { grid-column: 1/-1; font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); padding: 0.8rem 1.5rem; border-bottom: 1px solid var(--rule); background: var(--paper); }
    .featured-text { padding: 2.5rem; border-right: 1px solid var(--rule); }
    .featured-meta { display: flex; gap: 1.5rem; align-items: center; margin-bottom: 1.5rem; }
    .tag { font-family: var(--mono); font-size: 0.64rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); border: 1px solid currentColor; padding: 0.2rem 0.6rem; }
    .date { font-family: var(--mono); font-size: 0.66rem; color: var(--muted); letter-spacing: 0.06em; }
    .featured-post-title { font-family: var(--serif); font-weight: 400; font-size: clamp(1.5rem,3vw,2.2rem); line-height: 1.2; color: var(--ink); margin-bottom: 1rem; }
    .featured-excerpt { font-family: var(--sans); font-size: 0.88rem; color: var(--muted); line-height: 1.75; margin-bottom: 2rem; }
    .read-link { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--ink); padding-bottom: 1px; cursor: none; transition: opacity 0.2s; }
    .featured-aside { padding: 2.5rem; display: flex; flex-direction: column; justify-content: center; gap: 2rem; }
    .stat-num { font-family: var(--serif); font-size: 3rem; font-weight: 300; color: var(--ink); line-height: 1; }
    .stat-label { font-family: var(--mono); font-size: 0.64rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-top: 0.3rem; }
    .posts-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(300px,1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
    .post-card { background: var(--cream); padding: 2rem; cursor: none; transition: background 0.2s; }
    .post-card:hover { background: var(--paper); }
    .post-card-meta { display: flex; gap: 1rem; align-items: center; margin-bottom: 1.2rem; }
    .post-card-title { font-family: var(--serif); font-weight: 400; font-size: 1.25rem; line-height: 1.3; color: var(--ink); margin-bottom: 0.75rem; }
    .post-card-excerpt { font-family: var(--sans); font-size: 0.82rem; color: var(--muted); line-height: 1.7; margin-bottom: 1.5rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .post-card-footer { display: flex; align-items: center; justify-content: space-between; }
    .read-time { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
    .empty-state { text-align: center; padding: 5rem 2rem; border: 1px solid var(--rule); }
    .empty-state-title { font-family: var(--serif); font-size: 1.8rem; font-weight: 300; font-style: italic; color: var(--muted); margin-bottom: 0.75rem; }
    .empty-state-text { font-family: var(--sans); font-size: 0.84rem; color: var(--muted); }
    .reader-overlay { position: fixed; inset: 0; z-index: 200; background: var(--cream); overflow-y: auto; transform: translateY(100%); transition: transform 0.45s cubic-bezier(0.16,1,0.3,1); }
    .reader-overlay.open { transform: translateY(0); }
    .reader-nav { position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 3rem; background: rgba(245,240,232,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); z-index: 10; }
    .reader-back { display: flex; align-items: center; gap: 0.75rem; font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); background: none; border: none; cursor: none; transition: color 0.2s; }
    .reader-back:hover { color: var(--ink); }
    .reader-progress { font-family: var(--mono); font-size: 0.64rem; letter-spacing: 0.1em; color: var(--muted); }
    .reader-body { max-width: 680px; margin: 0 auto; padding: 4rem 2rem 8rem; }
    .reader-eyebrow { display: flex; gap: 1.5rem; align-items: center; margin-bottom: 2rem; }
    .reader-title { font-family: var(--serif); font-weight: 400; font-size: clamp(2rem,5vw,3.5rem); line-height: 1.1; letter-spacing: -0.01em; color: var(--ink); margin-bottom: 1.5rem; }
    .reader-subtitle { font-family: var(--serif); font-style: italic; font-weight: 300; font-size: 1.2rem; color: var(--muted); margin-bottom: 2.5rem; line-height: 1.5; }
    .reader-divider { border: none; border-top: 1px solid var(--rule); margin: 2.5rem 0; }
    .reader-content { font-family: var(--serif); font-size: 1.15rem; line-height: 1.85; color: var(--ink); }
    .reader-content p { margin-bottom: 1.5rem; }
    .reader-content h2 { font-family: var(--serif); font-weight: 500; font-size: 1.6rem; margin: 2.5rem 0 1rem; }
    .reader-content h3 { font-family: var(--serif); font-weight: 500; font-size: 1.25rem; margin: 2rem 0 0.75rem; }
    .reader-content blockquote { border-left: 2px solid var(--olive); margin: 2rem 0; padding: 0.5rem 0 0.5rem 2rem; font-style: italic; color: var(--accent); font-size: 1.25rem; }
    .reader-content ul, .reader-content ol { margin: 1rem 0 1.5rem 1.5rem; }
    .reader-content li { margin-bottom: 0.4rem; }
    .reader-content a { color: var(--olive); }
    .reader-content code { font-family: var(--mono); font-size: 0.85em; background: var(--paper); padding: 0.15em 0.4em; }
    footer { border-top: 1px solid var(--rule); padding: 2.5rem 3rem; position: relative; z-index: 1; }
    .footer-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .footer-copy { font-family: var(--mono); font-size: 0.64rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
    .footer-links { display: flex; gap: 1.5rem; }
    .footer-links a { font-family: var(--mono); font-size: 0.64rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color 0.2s; }
    .footer-links a:hover { color: var(--ink); }
    @media (max-width: 768px) {
      nav { padding: 1rem 1.5rem; } .nav-links { gap: 1.5rem; }
      .blog-header { padding: 7rem 1.5rem 3rem; }
      .filter-bar { padding: 1rem 1.5rem; }
      .content-area { padding: 2rem 1.5rem 5rem; }
      .featured-post { grid-template-columns: 1fr; }
      .featured-label { grid-column: 1; }
      .featured-text { border-right: none; border-bottom: 1px solid var(--rule); }
      .reader-nav { padding: 1rem 1.5rem; }
      .reader-body { padding: 3rem 1.5rem 6rem; }
      footer { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>
<div id="cursor-dot"></div>
<div id="cursor-ring"></div>

<nav>
  <a href="/" class="nav-logo">Muhammad Tahir</a>
  <div class="nav-links">
    <a href="/">Home</a>
    <a href="/blog.html" class="active">Writing</a>
    <a href="/#about">About</a>
    <a href="/#contact">Contact</a>
  </div>
</nav>

<div class="page">
  <header class="blog-header">
    <div class="blog-header-inner">
      <p class="blog-eyebrow">Essays & Notes</p>
      <h1 class="blog-title">Writing on <em>money,<br>markets & life</em></h1>
      <p class="blog-desc">Thoughts on finance, investing, and the questions worth sitting with.</p>
    </div>
  </header>

  <div class="filter-bar">
    <div class="filter-bar-inner">
      <span class="filter-label">Filter</span>
      <button class="filter-btn active" data-category="all">All</button>
      <button class="filter-btn" data-category="Finance">Finance</button>
      <button class="filter-btn" data-category="Investing">Investing</button>
      <button class="filter-btn" data-category="Personal">Personal</button>
    </div>
  </div>

  <main class="content-area">
    <div id="featured-slot"></div>
    <div id="posts-grid" class="posts-grid"></div>
    <div id="empty-state" class="empty-state" style="display:none;">
      <p class="empty-state-title">Nothing here yet.</p>
      <p class="empty-state-text">Check back soon — words are coming.</p>
    </div>
  </main>
</div>

<footer>
  <div class="footer-inner">
    <span class="footer-copy">© 2025 Muhammad Tahir</span>
    <div class="footer-links">
      <a href="https://iamuhammadtahir.medium.com" target="_blank">Medium</a>
      <a href="https://iamuhammadtahir.substack.com" target="_blank">Substack</a>
      <a href="https://x.com/iamuhammadtahir" target="_blank">X</a>
    </div>
  </div>
</footer>

<div class="reader-overlay" id="reader">
  <nav class="reader-nav">
    <button class="reader-back" onclick="closeReader()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M10 7H4M4 7L7 4M4 7L7 10"/>
      </svg>
      Back to Writing
    </button>
    <span class="reader-progress" id="reader-progress"></span>
  </nav>
  <div class="reader-body">
    <div class="reader-eyebrow">
      <span class="tag" id="reader-tag"></span>
      <span class="date" id="reader-date"></span>
    </div>
    <h1 class="reader-title" id="reader-title"></h1>
    <p class="reader-subtitle" id="reader-subtitle"></p>
    <hr class="reader-divider" />
    <div class="reader-content" id="reader-content"></div>
  </div>
</div>

<script>
  const dot = document.getElementById('cursor-dot');
  const ring = document.getElementById('cursor-ring');
  let mx=0,my=0,rx=0,ry=0;
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
  (function loop(){rx+=(mx-rx)*0.15;ry+=(my-ry)*0.15;dot.style.left=mx+'px';dot.style.top=my+'px';ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(loop);})();

  function getPosts(){try{return JSON.parse(localStorage.getItem('mt_blog_posts')||'[]');}catch{return[];}}
  function readTime(html){const w=html.replace(/<[^>]+>/g,'').split(/\s+/).filter(Boolean).length;return Math.max(1,Math.round(w/200))+' min read';}
  function formatDate(iso){return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});}

  let currentCategory='all';
  function render(cat){
    currentCategory=cat;
    const posts=getPosts().filter(p=>p.published!==false);
    const filtered=cat==='all'?posts:posts.filter(p=>p.category===cat);
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.category===cat));
    const fs=document.getElementById('featured-slot');
    const grid=document.getElementById('posts-grid');
    const empty=document.getElementById('empty-state');
    if(filtered.length===0){fs.innerHTML='';grid.innerHTML='';empty.style.display='block';return;}
    empty.style.display='none';
    const [featured,...rest]=filtered;
    fs.innerHTML=buildFeatured(featured,posts.length);
    grid.innerHTML=rest.map(buildCard).join('');
  }

  function buildFeatured(p,total){
    return `<article class="featured-post" onclick="openReader('${p.id}')">
      <div class="featured-label">Featured Essay</div>
      <div class="featured-text">
        <div class="featured-meta"><span class="tag">${p.category||'Essay'}</span><span class="date">${formatDate(p.date)}</span></div>
        <h2 class="featured-post-title">${p.title}</h2>
        <p class="featured-excerpt">${p.excerpt||''}</p>
        <span class="read-link">Read essay →</span>
      </div>
      <div class="featured-aside">
        <div><div class="stat-num">${String(total).padStart(2,'0')}</div><div class="stat-label">Essays published</div></div>
        <div><div class="stat-num">${readTime(p.content||'').split(' ')[0]}</div><div class="stat-label">Min to read</div></div>
      </div>
    </article>`;
  }

  function buildCard(p){
    return `<article class="post-card" onclick="openReader('${p.id}')">
      <div class="post-card-meta"><span class="tag">${p.category||'Essay'}</span><span class="date">${formatDate(p.date)}</span></div>
      <h3 class="post-card-title">${p.title}</h3>
      <p class="post-card-excerpt">${p.excerpt||''}</p>
      <div class="post-card-footer"><span class="read-time">${readTime(p.content||'')}</span><span class="read-link">Read →</span></div>
    </article>`;
  }

  function openReader(id){
    const post=getPosts().find(p=>p.id===id);
    if(!post)return;
    document.getElementById('reader-tag').textContent=post.category||'Essay';
    document.getElementById('reader-date').textContent=formatDate(post.date);
    document.getElementById('reader-title').textContent=post.title;
    document.getElementById('reader-subtitle').textContent=post.excerpt||'';
    document.getElementById('reader-content').innerHTML=post.content||'';
    document.getElementById('reader-progress').textContent=readTime(post.content||'');
    const r=document.getElementById('reader');
    r.classList.add('open');r.scrollTop=0;
    document.body.style.overflow='hidden';
  }

  function closeReader(){document.getElementById('reader').classList.remove('open');document.body.style.overflow='';}
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeReader();});
  document.querySelectorAll('.filter-btn').forEach(btn=>btn.addEventListener('click',()=>render(btn.dataset.category)));
  render('all');
</script>
</body>
</html>
