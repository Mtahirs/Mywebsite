<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Writing CMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Mono:wght@300;400&family=Instrument+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #F5F0E8; --ink: #1A1814; --olive: #4A4832;
      --muted: #8C8472; --rule: #D8D2C4; --accent: #6B6044;
      --paper: #EDE8DF; --danger: #8B3A3A;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --mono: 'DM Mono', monospace;
      --sans: 'Instrument Sans', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body { background: var(--cream); color: var(--ink); font-family: var(--sans); min-height: 100vh; }

    /* LOGIN */
    #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { width: 360px; text-align: center; }
    .login-logo { font-family: var(--serif); font-size: 1.5rem; font-weight: 400; margin-bottom: 0.5rem; }
    .login-sub { font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 3rem; }
    .login-box input { width: 100%; padding: 0.85rem 1rem; border: 1px solid var(--rule); background: var(--paper); font-family: var(--mono); font-size: 0.9rem; color: var(--ink); outline: none; margin-bottom: 0.75rem; letter-spacing: 0.08em; }
    .login-box input:focus { border-color: var(--accent); }
    .btn { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; padding: 0.75rem 1.5rem; border: 1px solid var(--ink); background: var(--ink); color: var(--cream); cursor: pointer; transition: all 0.2s; width: 100%; }
    .btn:hover { background: var(--olive); border-color: var(--olive); }
    .btn-ghost { background: transparent; color: var(--ink); }
    .btn-ghost:hover { background: var(--paper); }
    .btn-danger { background: var(--danger); border-color: var(--danger); color: white; }
    .btn-sm { padding: 0.45rem 0.85rem; font-size: 0.65rem; width: auto; }
    .login-error { font-family: var(--mono); font-size: 0.7rem; color: var(--danger); margin-top: 0.5rem; display: none; }

    /* ADMIN LAYOUT */
    #admin-screen { display: none; }
    .admin-nav { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; padding: 1rem 2rem; background: var(--ink); color: var(--cream); }
    .admin-nav-title { font-family: var(--serif); font-size: 1rem; font-weight: 400; letter-spacing: 0.04em; }
    .admin-nav-actions { display: flex; gap: 0.75rem; align-items: center; }
    .admin-nav .btn { padding: 0.4rem 1rem; font-size: 0.65rem; background: transparent; border-color: rgba(255,255,255,0.3); color: var(--cream); width: auto; }
    .admin-nav .btn:hover { background: rgba(255,255,255,0.1); }

    .admin-body { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 56px); }

    /* SIDEBAR */
    .sidebar { border-right: 1px solid var(--rule); background: var(--paper); overflow-y: auto; }
    .sidebar-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--rule); display: flex; align-items: center; justify-content: space-between; }
    .sidebar-title { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
    .post-list-item { padding: 1rem 1.5rem; border-bottom: 1px solid var(--rule); cursor: pointer; transition: background 0.15s; }
    .post-list-item:hover { background: var(--cream); }
    .post-list-item.active { background: var(--cream); border-left: 2px solid var(--ink); }
    .pli-title { font-family: var(--serif); font-size: 1rem; font-weight: 400; color: var(--ink); margin-bottom: 0.3rem; line-height: 1.3; }
    .pli-meta { font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.08em; color: var(--muted); display: flex; gap: 0.75rem; }
    .pli-actions { display: flex; gap: 0.4rem; margin-top: 0.6rem; }
    .draft-badge { font-family: var(--mono); font-size: 0.55rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--rule); padding: 0.1rem 0.4rem; }
    .empty-sidebar { padding: 3rem 1.5rem; text-align: center; font-family: var(--mono); font-size: 0.7rem; color: var(--muted); line-height: 1.8; }

    /* EDITOR */
    .editor-pane { display: flex; flex-direction: column; }
    .editor-toolbar { padding: 0.75rem 1.5rem; border-bottom: 1px solid var(--rule); display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; background: var(--cream); }
    .tb-btn { font-family: var(--mono); font-size: 0.7rem; padding: 0.3rem 0.6rem; border: 1px solid var(--rule); background: transparent; color: var(--muted); cursor: pointer; transition: all 0.15s; min-width: 30px; text-align: center; }
    .tb-btn:hover { background: var(--paper); color: var(--ink); border-color: var(--accent); }
    .tb-sep { width: 1px; background: var(--rule); height: 20px; margin: 0 0.2rem; }
    .editor-fields { padding: 1.5rem 2rem; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 1fr auto; gap: 1rem; align-items: start; }
    .field-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .field-label { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
    .field-input { font-family: var(--serif); font-size: 1.5rem; font-weight: 300; border: none; background: transparent; color: var(--ink); outline: none; width: 100%; padding: 0; }
    .field-input::placeholder { color: var(--rule); }
    .field-select { font-family: var(--mono); font-size: 0.72rem; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); padding: 0.4rem 0.75rem; outline: none; cursor: pointer; }
    .excerpt-input { font-family: var(--sans); font-size: 0.88rem; border: none; background: transparent; color: var(--muted); outline: none; width: 100%; padding: 0; resize: none; line-height: 1.6; }
    .content-editor { flex: 1; padding: 1.5rem 2rem; outline: none; font-family: var(--serif); font-size: 1.1rem; line-height: 1.85; color: var(--ink); min-height: 400px; overflow-y: auto; }
    .content-editor:empty::before { content: 'Start writing your essay...'; color: var(--rule); font-style: italic; }
    .content-editor p { margin-bottom: 1.2rem; }
    .content-editor h2 { font-size: 1.5rem; font-weight: 500; margin: 2rem 0 0.75rem; }
    .content-editor h3 { font-size: 1.2rem; font-weight: 500; margin: 1.5rem 0 0.5rem; }
    .content-editor blockquote { border-left: 2px solid var(--olive); padding: 0.3rem 0 0.3rem 1.5rem; margin: 1.5rem 0; font-style: italic; color: var(--accent); }
    .content-editor ul, .content-editor ol { margin: 0.75rem 0 1.25rem 1.5rem; }
    .content-editor li { margin-bottom: 0.3rem; }
    .content-editor a { color: var(--olive); }
    .content-editor code { font-family: var(--mono); font-size: 0.85em; background: var(--paper); padding: 0.1em 0.35em; }

    /* STATUS BAR */
    .status-bar { padding: 0.6rem 2rem; border-top: 1px solid var(--rule); display: flex; align-items: center; justify-content: space-between; background: var(--paper); }
    .status-text { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
    .status-actions { display: flex; gap: 0.75rem; }

    /* TOAST */
    .toast { position: fixed; bottom: 2rem; right: 2rem; background: var(--ink); color: var(--cream); font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.1em; padding: 0.75rem 1.5rem; opacity: 0; transform: translateY(10px); transition: all 0.3s; pointer-events: none; z-index: 999; }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* BACKUP PANEL */
    .backup-panel { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(26,24,20,0.6); align-items: center; justify-content: center; }
    .backup-panel.open { display: flex; }
    .backup-box { background: var(--cream); border: 1px solid var(--rule); width: 520px; max-height: 80vh; overflow-y: auto; }
    .backup-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--rule); display: flex; align-items: center; justify-content: space-between; }
    .backup-title { font-family: var(--serif); font-size: 1.1rem; }
    .backup-body { padding: 1.5rem; }
    .backup-section { margin-bottom: 1.5rem; }
    .backup-label { font-family: var(--mono); font-size: 0.64rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.75rem; }
    .backup-textarea { width: 100%; height: 140px; font-family: var(--mono); font-size: 0.72rem; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); padding: 0.75rem; resize: vertical; outline: none; }

    @media (max-width: 900px) {
      .admin-body { grid-template-columns: 1fr; }
      .sidebar { max-height: 240px; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">Muhammad Tahir</div>
    <div class="login-sub">Writing CMS</div>
    <input type="password" id="pw-input" placeholder="Password" onkeydown="if(event.key==='Enter')login()" />
    <button class="btn" onclick="login()">Enter</button>
    <div class="login-error" id="login-error">Incorrect password.</div>
  </div>
</div>

<!-- ADMIN -->
<div id="admin-screen">
  <nav class="admin-nav">
    <span class="admin-nav-title">Writing CMS</span>
    <div class="admin-nav-actions">
      <button class="btn" onclick="openBackup()">Backup / Restore</button>
      <button class="btn" onclick="logout()">Log out</button>
    </div>
  </nav>

  <div class="admin-body">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Posts</span>
        <button class="btn btn-sm" onclick="newPost()">+ New</button>
      </div>
      <div id="post-list"></div>
    </aside>

    <!-- EDITOR -->
    <div class="editor-pane" id="editor-pane">
      <div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-family:var(--mono);font-size:0.75rem;letter-spacing:0.12em;text-transform:uppercase;" id="editor-placeholder">
        Select a post or create a new one
      </div>

      <div id="editor-inner" style="display:none;flex-direction:column;flex:1;">
        <!-- TOOLBAR -->
        <div class="editor-toolbar">
          <button class="tb-btn" onclick="fmt('bold')" title="Bold"><b>B</b></button>
          <button class="tb-btn" onclick="fmt('italic')" title="Italic"><i>I</i></button>
          <button class="tb-btn" onclick="fmt('underline')" title="Underline"><u>U</u></button>
          <div class="tb-sep"></div>
          <button class="tb-btn" onclick="fmtBlock('h2')">H2</button>
          <button class="tb-btn" onclick="fmtBlock('h3')">H3</button>
          <button class="tb-btn" onclick="fmtBlock('p')">¶</button>
          <div class="tb-sep"></div>
          <button class="tb-btn" onclick="fmt('insertUnorderedList')">• List</button>
          <button class="tb-btn" onclick="fmt('insertOrderedList')">1. List</button>
          <button class="tb-btn" onclick="fmtBlock('blockquote')">" "</button>
          <div class="tb-sep"></div>
          <button class="tb-btn" onclick="insertLink()">Link</button>
          <button class="tb-btn" onclick="fmt('removeFormat')">Clear</button>
        </div>

        <!-- META FIELDS -->
        <div class="editor-fields">
          <div style="display:flex;flex-direction:column;gap:1rem;flex:1;">
            <div class="field-group">
              <label class="field-label">Title</label>
              <input class="field-input" id="f-title" placeholder="Essay title..." oninput="markDirty()" />
            </div>
            <div class="field-group">
              <label class="field-label">Excerpt / Subtitle</label>
              <textarea class="excerpt-input" id="f-excerpt" rows="2" placeholder="A one-sentence summary..." oninput="markDirty()"></textarea>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:0.75rem;min-width:140px;">
            <div class="field-group">
              <label class="field-label">Category</label>
              <select class="field-select" id="f-category" onchange="markDirty()">
                <option value="Finance">Finance</option>
                <option value="Investing">Investing</option>
                <option value="Personal">Personal</option>
              </select>
            </div>
            <div class="field-group">
              <label class="field-label">Date</label>
              <input type="date" class="field-select" id="f-date" oninput="markDirty()" />
            </div>
          </div>
        </div>

        <!-- RICH TEXT EDITOR -->
        <div class="content-editor" id="content-editor" contenteditable="true" oninput="markDirty()"></div>

        <!-- STATUS BAR -->
        <div class="status-bar">
          <span class="status-text" id="status-text">Unsaved</span>
          <div class="status-actions">
            <button class="btn btn-sm btn-ghost" onclick="deletePost()">Delete</button>
            <button class="btn btn-sm btn-ghost" onclick="saveDraft()">Save Draft</button>
            <button class="btn btn-sm" onclick="publishPost()">Publish</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- BACKUP PANEL -->
<div class="backup-panel" id="backup-panel">
  <div class="backup-box">
    <div class="backup-header">
      <span class="backup-title">Backup & Restore</span>
      <button class="btn btn-sm btn-ghost" onclick="closeBackup()">Close</button>
    </div>
    <div class="backup-body">
      <div class="backup-section">
        <div class="backup-label">Export — copy and save this JSON</div>
        <textarea class="backup-textarea" id="backup-export" readonly></textarea>
        <button class="btn btn-sm" style="margin-top:0.5rem;" onclick="copyExport()">Copy JSON</button>
      </div>
      <div class="backup-section">
        <div class="backup-label">Import — paste previously exported JSON</div>
        <textarea class="backup-textarea" id="backup-import" placeholder="Paste JSON here..."></textarea>
        <button class="btn btn-sm btn-danger" style="margin-top:0.5rem;" onclick="importData()">Restore (overwrites all posts)</button>
      </div>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
  /* ── AUTH ──────────────────────────────────────────────── */
  const PASSWORD = 'mt2025admin';
  function login(){
    const v=document.getElementById('pw-input').value;
    if(v===PASSWORD){sessionStorage.setItem('cms_auth','1');boot();}
    else{document.getElementById('login-error').style.display='block';}
  }
  function logout(){sessionStorage.removeItem('cms_auth');location.reload();}
  function boot(){
    document.getElementById('login-screen').style.display='none';
    document.getElementById('admin-screen').style.display='block';
    renderList();
  }
  if(sessionStorage.getItem('cms_auth')==='1') boot();

  /* ── DATA ──────────────────────────────────────────────── */
  function getPosts(){try{return JSON.parse(localStorage.getItem('mt_blog_posts')||'[]');}catch{return[];}}
  function savePosts(posts){localStorage.setItem('mt_blog_posts',JSON.stringify(posts));}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

  /* ── STATE ─────────────────────────────────────────────── */
  let currentId=null;
  let dirty=false;

  /* ── SIDEBAR LIST ──────────────────────────────────────── */
  function renderList(){
    const posts=getPosts();
    const el=document.getElementById('post-list');
    if(posts.length===0){el.innerHTML='<div class="empty-sidebar">No posts yet.<br>Click + New to begin.</div>';return;}
    el.innerHTML=posts.map(p=>`
      <div class="post-list-item${p.id===currentId?' active':''}" onclick="loadPost('${p.id}')">
        <div class="pli-title">${p.title||'Untitled'}</div>
        <div class="pli-meta">
          <span>${p.category||'—'}</span>
          <span>${formatDate(p.date)}</span>
          ${p.published===false?'<span class="draft-badge">Draft</span>':''}
        </div>
      </div>`).join('');
  }

  function formatDate(iso){
    if(!iso)return '—';
    return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  }

  /* ── EDITOR ────────────────────────────────────────────── */
  function showEditor(){
    document.getElementById('editor-placeholder').style.display='none';
    const inner=document.getElementById('editor-inner');
    inner.style.display='flex';
    inner.style.flexDirection='column';
    inner.style.flex='1';
  }

  function newPost(){
    if(dirty&&!confirm('Unsaved changes — continue?'))return;
    const p={id:uid(),title:'',excerpt:'',category:'Finance',date:new Date().toISOString().split('T')[0],content:'',published:false};
    const posts=getPosts();
    posts.unshift(p);
    savePosts(posts);
    loadPost(p.id);
  }

  function loadPost(id){
    if(dirty&&id!==currentId&&!confirm('Unsaved changes — continue?'))return;
    currentId=id;
    dirty=false;
    const posts=getPosts();
    const p=posts.find(x=>x.id===id);
    if(!p)return;
    document.getElementById('f-title').value=p.title||'';
    document.getElementById('f-excerpt').value=p.excerpt||'';
    document.getElementById('f-category').value=p.category||'Finance';
    document.getElementById('f-date').value=p.date||'';
    document.getElementById('content-editor').innerHTML=p.content||'';
    setStatus(p.published===false?'Draft':'Published');
    showEditor();
    renderList();
  }

  function markDirty(){dirty=true;setStatus('Unsaved changes');}
  function setStatus(t){document.getElementById('status-text').textContent=t;}

  function collectPost(published){
    return{
      title:document.getElementById('f-title').value.trim(),
      excerpt:document.getElementById('f-excerpt').value.trim(),
      category:document.getElementById('f-category').value,
      date:document.getElementById('f-date').value,
      content:document.getElementById('content-editor').innerHTML,
      published
    };
  }

  function saveDraft(){
    if(!currentId)return;
    const posts=getPosts();
    const idx=posts.findIndex(p=>p.id===currentId);
    if(idx===-1)return;
    Object.assign(posts[idx],collectPost(false));
    savePosts(posts);
    dirty=false;setStatus('Draft saved');renderList();toast('Draft saved');
  }

  function publishPost(){
    if(!currentId)return;
    const posts=getPosts();
    const idx=posts.findIndex(p=>p.id===currentId);
    if(idx===-1)return;
    if(!posts[idx].title&&!document.getElementById('f-title').value.trim()){alert('Add a title first.');return;}
    Object.assign(posts[idx],collectPost(true));
    savePosts(posts);
    dirty=false;setStatus('Published');renderList();toast('Post published');
  }

  function deletePost(){
    if(!currentId)return;
    if(!confirm('Delete this post? This cannot be undone.'))return;
    let posts=getPosts();
    posts=posts.filter(p=>p.id!==currentId);
    savePosts(posts);
    currentId=null;dirty=false;
    document.getElementById('editor-placeholder').style.display='flex';
    document.getElementById('editor-inner').style.display='none';
    renderList();toast('Post deleted');
  }

  /* ── FORMATTING ────────────────────────────────────────── */
  function fmt(cmd,val){document.getElementById('content-editor').focus();document.execCommand(cmd,false,val||null);}
  function fmtBlock(tag){document.getElementById('content-editor').focus();document.execCommand('formatBlock',false,tag);}
  function insertLink(){
    const url=prompt('URL:');
    if(url)fmt('createLink',url);
  }

  /* ── BACKUP ────────────────────────────────────────────── */
  function openBackup(){
    document.getElementById('backup-export').value=JSON.stringify(getPosts(),null,2);
    document.getElementById('backup-panel').classList.add('open');
  }
  function closeBackup(){document.getElementById('backup-panel').classList.remove('open');}
  function copyExport(){
    navigator.clipboard.writeText(document.getElementById('backup-export').value);
    toast('JSON copied');
  }
  function importData(){
    const raw=document.getElementById('backup-import').value.trim();
    if(!raw){alert('Paste JSON first.');return;}
    try{
      const data=JSON.parse(raw);
      if(!Array.isArray(data)){alert('Invalid format — expected an array.');return;}
      savePosts(data);
      currentId=null;dirty=false;
      closeBackup();renderList();toast('Restored '+data.length+' posts');
    }catch(e){alert('Invalid JSON: '+e.message);}
  }

  /* ── TOAST ─────────────────────────────────────────────── */
  let toastTimer;
  function toast(msg){
    const el=document.getElementById('toast');
    el.textContent=msg;el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>el.classList.remove('show'),2500);
  }
</script>
</body>
</html>
